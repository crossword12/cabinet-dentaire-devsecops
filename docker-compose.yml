services:
  web:
    build: .
    image: cabinet-dentaire:1.8
    container_name: cabinet_dentaire_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3